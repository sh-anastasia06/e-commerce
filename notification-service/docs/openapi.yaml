openapi: 3.1.0
info:
  title: Notification Service
  version: 1.0.0
servers:
  - url: http://localhost:8083/api/v1
    description: Local server

tags:
  - name: Notifications
    description: Notification and payment simulation operations

paths:
  /notifications:
    get:
      tags: [Notifications]
      summary: Get notification history
      operationId: getNotifications
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'

  /notifications/simulate-payment:
    post:
      tags: [Notifications]
      summary: Simulate payment response for an order
      operationId: simulatePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSimulationRequest'
      responses:
        '200':
          description: Payment simulation triggered successfully
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PaymentSimulationRequest:
      type: object
      required: [orderId, success]
      properties:
        orderId:
          type: string
          example: "650f1f1e8b1a2c3d4e5f6789"
        success:
          type: boolean
          example: true

    Notification:
      type: object
      required: [id, recipient, message, type, createdAt]
      properties:
        id:
          type: string
          example: "650f1f1e8b1a2c3d4e5f6789"
        recipient:
          type: string
          example: "user@example.com"
        message:
          type: string
          example: "Your order #650f1f1e has been created successfully."
        type:
          type: string
          enum: [EMAIL, PUSH]
          example: "EMAIL"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-27T12:00:00Z"

    NotificationPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 5
        totalPages:
          type: integer
          example: 1

    ErrorResponse:
      type: object
      required: [status, code, message, timestamp]
      properties:
        status:
          type: integer
          example: 400
        code:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Invalid parameters"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-27T12:00:00Z"
