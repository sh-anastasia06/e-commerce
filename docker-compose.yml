# Local development infrastructure for the e-commerce platform.
# Start everything:   docker compose up -d
# Stop (keep data):   docker compose down
# Stop (wipe data):   docker compose down -v
#
# This file only runs the INFRASTRUCTURE. The four Spring Boot services
# (product-catalog, user, order, notification) run from your IDE for now and
# connect to the ports below on localhost.
#
# NOTE: passwords here are for LOCAL DEVELOPMENT ONLY. Never reuse them anywhere real.

services:

  # ---------- PostgreSQL: ONE server, TWO databases ----------
  #   orders -> order-service   (created by POSTGRES_DB below)
  #   users  -> user-service    (created by the init script below)
  # Each service owns its database and never reads the other's.
  postgres:
    image: postgres:16
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom_dev_password
      POSTGRES_DB: orders
    ports:
      - "5433:5432"            # host:container -> connect from your IDE on localhost:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data   # named volume so data survives restarts
      # Scripts in this folder run ONLY when the data volume is empty (first start).
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:               # "is it actually ready?" (container running != database ready)
      test: ["CMD-SHELL", "pg_isready -U ecom -d orders"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- MongoDB: product catalog (product-catalog-service) ----------
  mongodb:
    image: mongo:7
    container_name: ecom-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ecom
      MONGO_INITDB_ROOT_PASSWORD: ecom_dev_password
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis: catalog cache (product-catalog-service) ----------
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Kafka in KRaft mode (no Zookeeper needed) ----------
  # Used by: order-service, notification-service, and user-service.
  kafka:
    image: apache/kafka:3.9.0
    container_name: ecom-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # With a single node, internal topics can only have 1 replica:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ---------- Kafka UI: browse topics and messages (very useful while learning) ----------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: ecom-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8089:8080"            # open http://localhost:8089
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------- SeaweedFS: S3-compatible object storage for product images ----------
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: ecom-seaweedfs
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"            # S3 API (your code talks to this)
      - "9333:9333"            # master web UI: http://localhost:9333
    volumes:
      - seaweedfs-data:/data

volumes:
  postgres-data:
  mongo-data:
  seaweedfs-data: