openapi: 3.1.0
info:
  title: User Service
  version: 1.0.0
servers:
  - url: http://localhost:8081/api/v1
    description: local

tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User profile management
  - name: JWKS
    description: JSON Web Key Set for token validation

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user and get JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /.well-known/jwks.json:
    servers:
      - url: http://localhost:8081
        description: local (this path has no /api/v1 prefix)
    get:
      tags: [JWKS]
      summary: Get JSON Web Key Set for JWT verification
      operationId: getJwks
      responses:
        '200':
          description: Public keys used to verify tokens issued by this service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Update current user profile (only provided fields are changed)
      operationId: patchCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed. Invalid credentials, or a missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists (for example, the email is already registered)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 8
          example: "StrongP@ss123"
        firstName:
          type: string
          maxLength: 50
          example: "John"
        lastName:
          type: string
          maxLength: 50
          example: "Doe"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "StrongP@ss123"

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          example: "eyJraWQiOiIwNTc5MTdkOC0uLi4i..."
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          description: Token lifetime in seconds
          example: 1800

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
          example: "7b1e5c2a-9d3f-4e8a-b1c6-2f4a8d9e0c13"
        email:
          type: string
          format: email
          example: "user@example.com"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"

    UserUpdateRequest:
      type: object
      description: All fields are optional. Only the provided fields are updated.
      properties:
        firstName:
          type: string
          maxLength: 50
          example: "John"
        lastName:
          type: string
          maxLength: 50
          example: "Smith"

    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'

    Jwk:
      type: object
      description: A public RSA key. Private key parts are never returned.
      required: [kty, kid, e, n]
      properties:
        kty:
          type: string
          example: "RSA"
        kid:
          type: string
          description: Key ID. Matches the kid in the header of issued tokens.
          example: "057917d8-277b-4909-8668-e668ce715883"
        e:
          type: string
          description: Public exponent
          example: "AQAB"
        n:
          type: string
          description: Modulus
          example: "x8Jq..."

    ErrorResponse:
      type: object
      required: [status, code, message, timestamp]
      properties:
        status:
          type: integer
          example: 400
        code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Invalid input parameters"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-27T12:00:00Z"
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: "password"
        message:
          type: string
          example: "Password must have at least 8 characters"