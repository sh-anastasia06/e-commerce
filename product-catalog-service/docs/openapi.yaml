openapi: 3.1.0
info:
  title: Product Catalog Service
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: local
tags:
  - name: Products
    description: Product catalog operations

paths:
  /products:
    get:
      tags: [Products]
      summary: Get list of product with optional filtering and pagination
      operationId: getAllProducts
      parameters:
        - name: category
          in: query
          description: Filter products by category
          required: false
          schema:
            type: string
            example: "Electronics"
        - name: minPrice
          in: query
          description: Minimum price filter
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            example: 10.00
        - name: maxPrice
          in: query
          description: Maximum price filter
          required: false
          schema:
            type: number
            format: double
            minimum: 0
            example: 500.00
        - name: page
          in: query
          description: Page number (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Success with the list of products
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [Products]
      summary: Create new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by id
      operationId: getProductById
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Products]
      summary: Update product
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product was successfully updated. Return the updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Products]
      summary: Delete a product by id
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product was successfully deleted
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product unique id
      schema:
        type: string
        example: "650f1f1e8b1a2c3d4e5f6789"

  responses:
    BadRequest:
      description: Validation error or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Product not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Product:
      type: object
      required: [ id, name, price, category ]
      properties:
        id:
          type: string
          example: "650f1f1e8b1a2c3d4e5f6789"
        name:
          type: string
          example: "Samsung Smartphone"
        price:
          type: number
          format: double
          example: 799.99
        category:
          type: string
          example: "Electronics"
        attributes:
          type: object
          additionalProperties: true

    ProductRequest:
      type: object
      required: [ name, price, category ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Lenovo Laptop"
        price:
          type: number
          format: double
          minimum: 0
          example: 1200.00
        category:
          type: string
          minLength: 1
          example: "Computers"
        attributes:
          type: object
          additionalProperties: true
          example: { ramGb: 16, color: "silver" }

    ProductPage:
      type: object
      required: [ content, page, size, totalElements, totalPages ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 3

    ErrorResponse:
      type: object
      required: [status, code, message, timestamp]
      properties:
        status:
          type: integer
          example: 404
        code:
          type: string
          example: "PRODUCT_NOT_FOUND"
        message:
          type: string
          example: "Product with ID 12345 was not found"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-24T15:56:00Z"
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: "price"
        message:
          type: string
          example: "Price must me greater than or equal to 0"
