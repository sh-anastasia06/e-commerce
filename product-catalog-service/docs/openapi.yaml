openapi: 3.1.0
info:
  title: Product Catalog Service
  version: 1.0.0
  description: Product and category management for the e-commerce platform.

servers:
  - url: http://localhost:8080/api/v1
    description: local

tags:
  - name: Products
    description: Product catalog operations
  - name: Categories
    description: Category operations

paths:
  /categories:
    get:
      tags: [Categories]
      summary: Get all categories
      operationId: getAllCategories
      responses:
        '200':
          description: Success with the list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

    post:
      tags: [Categories]
      summary: Create new category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category was successfully created
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Category slug already exists (SLUG_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by id
      operationId: getCategoryById
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CategoryNotFound'

    put:
      tags: [Categories]
      summary: Update category
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category was successfully updated. Returns the updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          description: Category slug already exists (SLUG_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Categories]
      summary: Delete a category by id
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category was successfully deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          description: Category is still referenced by products (CATEGORY_IN_USE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products:
    get:
      tags: [Products]
      summary: Get list of products with optional filtering and pagination
      operationId: getAllProducts
      parameters:
        - name: categoryId
          in: query
          description: Filter products by category id
          required: false
          schema:
            type: string
            format: uuid
        - name: minPrice
          in: query
          description: Minimum price filter (decimal amount, inclusive)
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d{1,2})?$'
            example: "10.00"
        - name: maxPrice
          in: query
          description: Maximum price filter (decimal amount, inclusive). Must not be less than minPrice
          required: false
          schema:
            type: string
            pattern: '^\d+(\.\d{1,2})?$'
            example: "500.00"
        - name: page
          in: query
          description: Page number (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Success with the page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [Products]
      summary: Create new product (created in DRAFT status)
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product was successfully created
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: SKU already exists (SKU_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/CategoryReferenceNotFound'

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by id
      operationId: getProductById
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'

    put:
      tags: [Products]
      summary: Update product (full replacement of editable fields)
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product was successfully updated. Returns the updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: >
            SKU already exists (SKU_ALREADY_EXISTS), the product is ARCHIVED and cannot be modified
              (INVALID_PRODUCT_STATE), or the product is ACTIVE and the new price is zero
              (INVALID_PRODUCT_STATE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/CategoryReferenceNotFound'

    delete:
      tags: [Products]
      summary: Delete a product by id (allowed only in DRAFT status)
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product was successfully deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: Product is not in DRAFT status, archive it instead (INVALID_PRODUCT_STATE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}/activate:
    post:
      tags: [Products]
      summary: Activate a product (DRAFT -> ACTIVE)
      description: Allowed only for a DRAFT product whose price amount is greater than zero.
      operationId: activateProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product was activated. Returns the updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: Product is not in DRAFT status or its price is zero (INVALID_PRODUCT_STATE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}/archive:
    post:
      tags: [Products]
      summary: Archive a product (DRAFT or ACTIVE -> ARCHIVED)
      operationId: archiveProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product was archived. Returns the updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: Product is already ARCHIVED (INVALID_PRODUCT_STATE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  headers:
    Location:
      description: URL of the newly created resource
      schema:
        type: string
        format: uri-reference
        example: /api/v1/products/3fa85f64-5717-4562-b3fc-2c963f66afa6

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product unique id
      schema:
        type: string
        format: uuid
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
    CategoryId:
      name: id
      in: path
      required: true
      description: Category unique id
      schema:
        type: string
        format: uuid
        example: "9b2c1d4e-6f7a-4b8c-9d0e-1a2b3c4d5e6f"

  responses:
    BadRequest:
      description: Validation error, malformed id or invalid parameters (VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            code: VALIDATION_ERROR
            message: Invalid input parameters
            timestamp: "2026-11-05T07:00:00Z"
            details:
              - field: price.amount
                message: Amount must be a decimal with at most 2 fraction digits
    ProductNotFound:
      description: Product not found (PRODUCT_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryNotFound:
      description: Category not found (CATEGORY_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryReferenceNotFound:
      description: The categoryId in the request body does not reference an existing category (CATEGORY_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ProductStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal amount as a string to avoid floating point precision loss
          pattern: '^\d+(\.\d{1,2})?$'
          example: "799.99"
        currency:
          type: string
          description: ISO 4217 currency code
          pattern: '^[A-Z]{3}$'
          example: "USD"

    Attributes:
      type: object
      maxProperties: 50
      propertyNames:
          minLength: 1
          maxLength: 50
          pattern: '^[^.$][^.]*$'
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 200
          - type: number
          - type: boolean
      example: { ramGb: 16, color: "silver" }

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
          example: "9b2c1d4e-6f7a-4b8c-9d0e-1a2b3c4d5e6f"
        name:
          type: string
          example: "Electronics"
        slug:
          type: string
          example: "electronics"
        description:
          type: string
          example: "Phones, laptops and accessories"

    CategoryRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Electronics"
        slug:
          type: string
          description: URL-friendly unique identifier, lowercase letters, digits and hyphens
          minLength: 1
          maxLength: 100
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: "electronics"
        description:
          type: string
          maxLength: 500
          example: "Phones, laptops and accessories"

    Product:
      type: object
      required: [id, sku, name, price, categoryId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        sku:
          type: string
          example: "SAM-S24-BLK-128"
        name:
          type: string
          example: "Samsung Smartphone"
        description:
          type: string
          example: "6.2 inch display, 128 GB"
        price:
          $ref: '#/components/schemas/Money'
        categoryId:
          type: string
          format: uuid
          example: "9b2c1d4e-6f7a-4b8c-9d0e-1a2b3c4d5e6f"
        status:
          $ref: '#/components/schemas/ProductStatus'
        attributes:
          $ref: '#/components/schemas/Attributes'
        createdAt:
          type: string
          format: date-time
          example: "2026-11-05T07:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-05T07:00:00Z"

    ProductRequest:
      type: object
      required: [sku, name, price, categoryId]
      properties:
        sku:
          type: string
          description: Unique stock keeping unit, uppercase letters, digits and hyphens
          minLength: 3
          maxLength: 64
          pattern: '^[A-Z0-9]+(-[A-Z0-9]+)*$'
          example: "LEN-T14-SLV-16"
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Lenovo Laptop"
        description:
          type: string
          maxLength: 2000
          example: "14 inch, 16 GB RAM"
        price:
          $ref: '#/components/schemas/Money'
        categoryId:
          type: string
          format: uuid
          example: "9b2c1d4e-6f7a-4b8c-9d0e-1a2b3c4d5e6f"
        attributes:
          $ref: '#/components/schemas/Attributes'

    ProductPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 3

    ErrorResponse:
      type: object
      required: [status, code, message, timestamp]
      properties:
        status:
          type: integer
          example: 404
        code:
          type: string
          description: Stable machine-readable error code
          enum:
            - VALIDATION_ERROR
            - PRODUCT_NOT_FOUND
            - CATEGORY_NOT_FOUND
            - SKU_ALREADY_EXISTS
            - SLUG_ALREADY_EXISTS
            - INVALID_PRODUCT_STATE
            - CATEGORY_IN_USE
          example: "PRODUCT_NOT_FOUND"
        message:
          type: string
          example: "Product with ID 3fa85f64-5717-4562-b3fc-2c963f66afa6 was not found"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-05T07:00:00Z"
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: "price.amount"
        message:
          type: string
          example: "Amount must be a decimal with at most 2 fraction digits"