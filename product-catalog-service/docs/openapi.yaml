openapi: 3.1.0
info:
  title: Product Catalog Service
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: local

paths:
  /products:
    get:
      summary: Get list of product with optional filtering and pagination
      operationId: getAllProducts
      parameters:
        - name: category
          in: query
          description: Filter products by category
          required: false
          schema:
            type: string
            example: "Electronics"
        - name: minPrice
          in: query
          description: Minimum price filter
          required: false
          schema:
            type: number
            format: double
            example: 10.00
        - name: maxPrice
          in: query
          description: Maximum price filter
          required: false
          schema:
            type: number
            format: double
            example: 500.00
        - name: page
          in: query
          description: Page number (0-indexed)
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Success with the list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      summary: Create new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation error

  /products/{id}:
    get:
      summary: Get product by id
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

    put:
      summary: Update product
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          description: Product unique id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product was successfully updated. Return the updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Wrong data format
        '404':
          description: Product not found

    delete:
      summary: Delete a product by id
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          description: Product unique id
          schema:
            type: string
      responses:
        '204':
          description: Product was successfully deleted
        '404':
          description: Product not found

components:
  schemas:
    Product:
      type: object
      required: [ id, name, price, category ]
      properties:
        id:
          type: string
          example: "650f1f1e8b1a2c3d4e5f6789"
        name:
          type: string
          example: "Samsung Smartphone"
        price:
          type: number
          format: double
          example: 799.99
        category:
          type: string
          example: "Electronics"
        attributes:
          type: object
          additionalProperties: true

    ProductCreateRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          example: "Lenovo Laptop"
        price:
          type: number
          format: double
          example: 1200.00
        category:
          type: string
          example: "Computers"

    ProductUpdateRequest:
      type: object
      required: [name, price, category]
      properties:
        name:
          type: string
          example: "Apple Headphones"
        price:
          type: number
          format: double
          example: 120.00
        category:
          type: string
          example: "Electronics"